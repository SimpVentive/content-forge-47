<!DOCTYPE html>
<html>
<head>
    <title>ContentForge Debug</title>
</head>
<body>
    <div id="debug" style="font-family: monospace; white-space: pre-wrap; padding: 20px; background: #f0f0f0;">
        <h2>ContentForge App Debug</h2>
        <p>Loading app from http://localhost:8082...</p>
    </div>
    <iframe id="app-frame" src="http://localhost:8082" style="width: 100%; height: 600px; border: 1px solid red; margin-top: 20px;"></iframe>

    <script>
        const debug = document.getElementById('debug');
        const logs = [];

        function log(msg) {
            console.log(msg);
            logs.push(msg);
            debug.textContent += '\n' + msg;
        }

        log('Page loaded at: ' + new Date().toISOString());

        // Try to access iframe
        const iframe = document.getElementById('app-frame');

        iframe.onload = function() {
            log('iframe loaded successfully');
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                log('iframe root element: ' + doc.getElementById('root'));
                log('iframe body HTML length: ' + doc.body.innerHTML.length);
            } catch (e) {
                log('Could not access iframe content: ' + e.message);
            }
        };

        iframe.onerror = function(e) {
            log('iframe error: ' + JSON.stringify(e));
        };

        // Set timeout to check after 5 seconds
        setTimeout(() => {
            log('\n--- Check after 5 seconds ---');
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const root = doc.getElementById('root');
                if (root) {
                    log('Root element found');
                    log('Root innerHTML length: ' + root.innerHTML.length);
                    if (root.innerHTML.includes('error') || root.innerHTML.includes('Error')) {
                        log('ERROR DETECTED IN ROOT');
                        log('First 500 chars: ' + root.innerHTML.substring(0, 500));
                    }
                } else {
                    log('Root element NOT found');
                }
            } catch (e) {
                log('Error checking iframe: ' + e.message);
            }
        }, 5000);
    </script>
</body>
</html>
